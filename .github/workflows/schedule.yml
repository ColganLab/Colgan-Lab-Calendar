name: Run Lab Calendar Automation

on:
  schedule:
    # Runs every Monday morning at 8:00 AM UTC (2:00 AM MDT)
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows you to trigger this manually from GitHub if you ever want to test it instantly

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm install

    - name: Execute Automation Script
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: node automate.js
